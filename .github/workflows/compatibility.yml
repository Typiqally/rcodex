name: Codex compatibility

on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-compatibility
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      latest: ${{ steps.versions.outputs.latest }}
      supported: ${{ steps.versions.outputs.supported }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Detect current stable Codex
        id: versions
        run: python3 scripts/check_compatibility.py detect
      - name: Install isolated baseline and candidate CLIs
        env:
          BASELINE: ${{ steps.versions.outputs.supported }}
          CANDIDATE: ${{ steps.versions.outputs.latest }}
        run: |
          npm install --prefix "$RUNNER_TEMP/baseline" --no-audit --no-fund "@openai/codex@$BASELINE"
          npm install --prefix "$RUNNER_TEMP/candidate" --no-audit --no-fund "@openai/codex@$CANDIDATE"
      - name: Compare remote CLI options and App Server schemas
        env:
          CANDIDATE: ${{ steps.versions.outputs.latest }}
          CODEX_HOME: ${{ runner.temp }}/isolated-codex-home
        run: |
          mkdir -p "$CODEX_HOME"
          "$RUNNER_TEMP/baseline/node_modules/.bin/codex" --help > "$RUNNER_TEMP/baseline-help.txt"
          "$RUNNER_TEMP/candidate/node_modules/.bin/codex" --help > "$RUNNER_TEMP/candidate-help.txt"
          "$RUNNER_TEMP/baseline/node_modules/.bin/codex" app-server generate-json-schema --experimental --out "$RUNNER_TEMP/baseline-schema"
          "$RUNNER_TEMP/candidate/node_modules/.bin/codex" app-server generate-json-schema --experimental --out "$RUNNER_TEMP/candidate-schema"
          python3 scripts/check_compatibility.py compare --version "$CANDIDATE" \
            --baseline "$RUNNER_TEMP/baseline-schema" --candidate "$RUNNER_TEMP/candidate-schema" \
            --baseline-help "$RUNNER_TEMP/baseline-help.txt" --candidate-help "$RUNNER_TEMP/candidate-help.txt" \
            --out "compatibility/candidates/$CANDIDATE.json"
      - name: Run offline contract tests
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          cargo test --locked --all-targets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compatibility-evidence
          path: compatibility/candidates/*.json
          if-no-files-found: error

  propose:
    needs: check
    if: needs.check.outputs.latest != needs.check.outputs.supported
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: compatibility-evidence
          path: compatibility/candidates
      - name: Prepare compatibility proposal
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ needs.check.outputs.latest }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/propose_compatibility.py

  report-failure:
    needs: [check, propose]
    if: always() && (needs.check.result == 'failure' || needs.propose.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Report failed compatibility check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/propose_compatibility.py --failure
